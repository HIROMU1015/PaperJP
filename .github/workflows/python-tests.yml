name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: paper-translator
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: paper-translator/pyproject.toml
      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[dev]"
      # tests/conftest.py rejects real network/subprocess calls. Claude responses
      # are protocol fixtures; no AI CLI installation, credentials or API calls.
      - name: Test offline pipeline and isolation
        run: python -m pytest -p no:cacheprovider --junitxml=reports/pytest-ci.xml
